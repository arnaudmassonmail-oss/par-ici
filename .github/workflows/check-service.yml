name: Vérifier le service en ligne

on:
  workflow_dispatch:
    inputs:
      url:
        description: Adresse du service
        default: https://par-ici-france.onrender.com

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger le service
        run: |
          U="${{ github.event.inputs.url }}"
          {
            echo "Service : $U ($(date -u +%FT%TZ))"
            echo "Page d'accueil : $(curl -s -m 120 -o /dev/null -w '%{http_code} en %{time_total} s' "$U/")"
            for p in "Lyon 45.758 4.835" "Cugand 47.0603 -1.2525" "Arles 43.677 4.628"; do
              set -- $p
              r=$(curl -s -m 120 -w '\n%{http_code} %{time_total}' "$U/api/events?lat=$2&lon=$3")
              code=$(echo "$r" | tail -1)
              body=$(echo "$r" | sed '$d')
              echo "$1 : HTTP $code s ; $(echo "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log((j.EV||[]).length+" sorties, lieu "+j.place+(j.error?" erreur "+j.error:""))}catch{console.log("réponse : "+s.slice(0,200))}})')"
            done
          } | tee scripts/check-service.log
      - name: Publier le compte rendu
        run: |
          git config user.name "par-ici-bot"
          git config user.email "par-ici-bot@users.noreply.github.com"
          git add scripts/check-service.log
          git diff --cached --quiet && exit 0
          git commit -m "Vérification du service en ligne"
          git pull --rebase -q origin main
          git push
