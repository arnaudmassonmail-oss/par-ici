name: Annuaire des cinémas

on:
  schedule:
    - cron: '17 3 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construire la liste des cinémas
        run: node scripts/build-cinemas.mjs
      - name: Publier
        if: always()
        run: |
          git config user.name "par-ici-bot"
          git config user.email "par-ici-bot@users.noreply.github.com"
          git add scripts/cinemas.log lib/cinemas.json 2>/dev/null || git add scripts/cinemas.log
          git diff --cached --quiet && exit 0
          git commit -m "Annuaire des cinémas"
          git pull --rebase -q origin main
          git push
