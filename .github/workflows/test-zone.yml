name: Test de la collecte ailleurs en France

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collecter autour de quelques villes
        env:
          OPENAGENDA_KEY: ${{ secrets.OPENAGENDA_KEY }}
          DATATOURISME_KEY: ${{ secrets.DATATOURISME_KEY }}
        run: node scripts/test-zone.mjs
      - name: Lancer le serveur et l'interroger
        env:
          OPENAGENDA_KEY: ${{ secrets.OPENAGENDA_KEY }}
          DATATOURISME_KEY: ${{ secrets.DATATOURISME_KEY }}
        run: |
          (/usr/bin/time -v node server/index.mjs > server.out 2>&1; echo "fin du serveur, code $?" >> server.out) &
          sleep 2
          for p in "Saint-Michel-Chef-Chef 47.181 -2.149" "Cugand 47.0603 -1.2525" "Arles 43.677 4.628" "Lyon 45.758 4.835"; do set -- $p; curl -s -m 120 -o "$1.json" "http://localhost:3000/api/events?lat=$2&lon=$3"; node -e 'const j=require("./"+process.argv[1]+".json");console.log(process.argv[1]+" : "+j.EV.length+" sorties ; cinémas "+Object.values(j.CINEMAS||{}).map(c=>c.n).join(", ")+" ; films "+(j.FILMS||[]).slice(0,12).map(f=>f.t+" "+JSON.stringify(f.s)).join(" · "))' "$1" >> server.out 2>&1; done
          pkill -f "node server/index.mjs"; sleep 2
          { echo; echo '## Serveur'; grep -v -E '^\s+(Page|Volunt|Invol|Swaps|File sys|Socket|Signals|Average|Exit status|Minor|Major|Percent|System time|User time)' server.out; } >> scripts/test-zone.log
      - name: Publier le compte rendu
        run: |
          git config user.name "par-ici-bot"
          git config user.email "par-ici-bot@users.noreply.github.com"
          git add scripts/test-zone.log
          git diff --cached --quiet && exit 0
          git commit -m "Test de la collecte ailleurs en France"
          git pull --rebase -q origin main
          git push
